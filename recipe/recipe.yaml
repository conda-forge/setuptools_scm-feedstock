schema_version: 1

context:
  version: "10.3.4"

recipe:
  name: setuptools_scm
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/setuptools_scm/setuptools_scm-${{ version }}.tar.gz
  sha256: a69f28bfc245608781205e912faae437c2b2165773afa4e7b979d77447a69dd2

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: setuptools-scm
    build:
      script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - setuptools >=45
        - vcs_versioning >=2.5.0.dev0,<3
        - tomli >=1
        - typing_extensions >=4.1
        - pip
      run:
        - python >=${{ python_min }}
        - vcs_versioning >=2.5.0.dev0,<3
        - packaging >=20
        - setuptools
        - tomli >=1
        - typing_extensions >=4.1

    tests:
      - python:
          imports:
            - setuptools_scm
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
      - requirements:
          run:
            - pip
            - python
        script:
          - setuptools-scm --help
    about:
      summary: the blessed package to manage your versions by scm tags

  - package:
      name: setuptools_scm
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("setuptools-scm", exact=True) }}
    tests:
      - python:
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
    about:
      summary: the blessed package to manage your versions by scm tags

about:
  summary: the blessed package to manage your versions by scm tags
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/setuptools-scm/

extra:
  recipe-maintainers:
    - ocefpaf
    - kwilcox
    - astaric
